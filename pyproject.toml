[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-etf-agents"
version = "0.2.0"
description = "Multi-agent AI analyst for Canadian ETFs, with evals, guardrails and a backtester"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shivani Anghan" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
ui = ["streamlit>=1.40", "yfinance>=0.2.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "yfinance>=0.2.40"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
maple-etf = "maple_etf.cli:main"

[tool.setuptools.packages.find]
include = ["maple_etf*"]

[tool.setuptools.package-data]
maple_etf = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
