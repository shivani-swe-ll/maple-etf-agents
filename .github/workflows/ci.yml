name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Golden-set evals (fail if decision accuracy < 90%)
        run: python -m maple_etf eval --min-accuracy 0.9
